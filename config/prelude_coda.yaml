model_config:
  model_type: PreludeCoda
  d_model: 256
  d_loop: 256
  n_heads: 8
  scale_mlp: 4
  n_prelude: 2
  n_loop: 4
  n_coda: 2
  max_train_loops: 6
  enforced: false
  tie_embeddings: true

data_config:
  dataset_type: SymbolicReasoningDataset
  data_dir: "data"
  batch_size: 128

training:
  num_epochs: 10
  lr: 0.001
  eval_epoch: 1
  use_wandb: false
  wandb_project: "recursive-reasoning"
